[package]
name = "smartshower"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "smartshower"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[dependencies]
shower-core = { path = "../core" }
log = "0.4"
anyhow = "1"
esp-idf-svc = "0.53"
ssd1306 = "0.10"
embedded-graphics = "0.8"
serde = "1"
serde_json = "1"

[build-dependencies]
embuild = "0.33.5"
